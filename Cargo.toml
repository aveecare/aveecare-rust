[package]
name = "aveecare"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Official Rust library for the AveeCare API: patients, visits, caregivers and billing for home care agencies."
license = "MIT"
readme = "README.md"
homepage = "https://www.aveecare.com/docs/api"
documentation = "https://docs.rs/aveecare"
repository = "https://github.com/aveecare/aveecare-rust"
keywords = ["aveecare", "home-care", "evv", "healthcare", "api"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["src/**/*", "examples/**/*", "README.md", "LICENSE", "CHANGELOG.md", "Cargo.toml"]

[features]
default = []
## Synchronous client in `aveecare::blocking` (runs its own Tokio runtime).
blocking = ["tokio/rt"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fastrand = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[[example]]
name = "quickstart"

[[example]]
name = "pagination"

[[example]]
name = "blocking"
required-features = ["blocking"]

[package.metadata.docs.rs]
all-features = true
